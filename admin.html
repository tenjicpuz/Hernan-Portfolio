<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow"><title>Portfolio Admin | HGA</title>
  <style>
    :root{color-scheme:dark;--red:#e23b4b;--bg:#09090d;--panel:#151319;--line:#38232d;--muted:#b8aab1}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f7edf0;font:16px system-ui,sans-serif}
    main{width:min(680px,calc(100% - 32px));margin:48px auto}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px;margin:18px 0}
    h1{font-size:2rem;margin:0 0 8px}p{color:var(--muted);line-height:1.6}label{display:block;margin:16px 0 7px;font-weight:650}
    input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#0e0d12;color:white}
    button{border:0;border-radius:10px;background:var(--red);color:white;font-weight:750;padding:12px 18px;margin-top:16px;cursor:pointer}
    button.secondary{background:#34212a}button:disabled{opacity:.5;cursor:wait}.row{display:flex;justify-content:space-between;gap:16px;align-items:center;border-top:1px solid var(--line);padding:14px 0}
    .status{min-height:24px;color:#ff9aa4}.hidden{display:none}.hint{font-size:.88rem}
  </style>
</head>
<body><main>
  <h1>Portfolio admin</h1><p>Sign in to add certificates to your public portfolio. Uploads appear automatically in the Certificates section.</p>
  <section class="panel" id="login-panel"><h2>Sign in</h2>
    <form id="login-form"><label for="email">Admin email</label><input id="email" type="email" autocomplete="username" required>
      <label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required>
      <button type="submit">Sign in</button></form>
  </section>
  <section class="panel hidden" id="manager"><div class="row"><h2>Certificates</h2><button class="secondary" id="logout" type="button">Sign out</button></div>
    <form id="upload-form"><label for="title">Certificate title</label><input id="title" maxlength="120" required>
      <label for="issuer">Issuing organization</label><input id="issuer" maxlength="120">
      <label for="issued">Date issued (optional)</label><input id="issued" type="date">
      <label for="file">Certificate file (PDF, PNG, JPG, WEBP; max 10 MB)</label><input id="file" type="file" accept="application/pdf,image/png,image/jpeg,image/webp" required>
      <button id="upload-button" type="submit">Upload certificate</button></form>
    <p class="hint">Only upload certificates you have permission to publish. Public certificates can be viewed by anyone.</p>
    <h3>Published certificates</h3><div id="items"></div>
  </section>
  <p class="status" id="status" role="status" aria-live="polite"></p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./config.js"></script>
<script>
(() => {
  const status = document.getElementById('status');
  const loginPanel = document.getElementById('login-panel');
  const manager = document.getElementById('manager');
  if (!window.PORTFOLIO_CONFIG || PORTFOLIO_CONFIG.supabaseUrl.includes('YOUR_') || PORTFOLIO_CONFIG.supabaseAnonKey.includes('YOUR_')) {
    status.textContent = 'First add your Supabase project URL and publishable/anon key to config.js.'; return;
  }
  const db = window.supabase.createClient(PORTFOLIO_CONFIG.supabaseUrl, PORTFOLIO_CONFIG.supabaseAnonKey);
  const bucket = 'certificates';
  const say = message => status.textContent = message;
  async function refresh() {
    const {data,error}=await db.from('certificates').select('id,title,issuer,issued_on,storage_path').order('created_at',{ascending:false});
    if(error){say(error.message);return;}
    document.getElementById('items').innerHTML = data.length ? data.map(item => `<div class="row"><div><strong>${safe(item.title)}</strong><br><small>${safe(item.issuer||'')}</small></div><button class="secondary" data-delete="${safe(item.id)}" data-path="${safe(item.storage_path)}">Delete</button></div>`).join('') : '<p>No certificates uploaded yet.</p>';
  }
  function safe(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  async function showSession(){const {data}=await db.auth.getSession();const signed=!!data.session;loginPanel.classList.toggle('hidden',signed);manager.classList.toggle('hidden',!signed);if(signed)await refresh();}
  document.getElementById('login-form').addEventListener('submit',async e=>{e.preventDefault();say('Signing in…');const {error}=await db.auth.signInWithPassword({email:document.getElementById('email').value,password:document.getElementById('password').value});if(error)say(error.message);else{say('Signed in.');await showSession();}});
  document.getElementById('logout').addEventListener('click',async()=>{await db.auth.signOut();say('Signed out.');await showSession();});
  document.getElementById('upload-form').addEventListener('submit',async e=>{
    e.preventDefault();const button=document.getElementById('upload-button');button.disabled=true;
    try{
      const file=document.getElementById('file').files[0];if(!file)throw new Error('Choose a file first.');
      const allowed=['application/pdf','image/png','image/jpeg','image/webp'];if(!allowed.includes(file.type))throw new Error('Only PDF, PNG, JPG, and WEBP files are allowed.');
      if(file.size>10*1024*1024)throw new Error('File must be 10 MB or smaller.');
      const ext=file.name.split('.').pop().toLowerCase();const path=`${crypto.randomUUID()}.${ext}`;
      say('Uploading file…');const {error:uploadError}=await db.storage.from(bucket).upload(path,file,{upsert:false,contentType:file.type});if(uploadError)throw uploadError;
      const {data:publicData}=db.storage.from(bucket).getPublicUrl(path);
      const {error:insertError}=await db.from('certificates').insert({title:document.getElementById('title').value.trim(),issuer:document.getElementById('issuer').value.trim()||null,issued_on:document.getElementById('issued').value||null,storage_path:path,public_url:publicData.publicUrl});
      if(insertError){await db.storage.from(bucket).remove([path]);throw insertError;}
      e.target.reset();say('Certificate uploaded and published.');await refresh();
    }catch(error){say(error.message||'Upload failed.');}finally{button.disabled=false;}
  });
  document.getElementById('items').addEventListener('click',async e=>{const button=e.target.closest('[data-delete]');if(!button)return;if(!confirm('Delete this certificate from the public gallery?'))return;
    const {error:rowError}=await db.from('certificates').delete().eq('id',button.dataset.delete);if(rowError){say(rowError.message);return;}
    const {error:fileError}=await db.storage.from(bucket).remove([button.dataset.path]);if(fileError)say('Record deleted, but storage cleanup failed: '+fileError.message);else say('Certificate deleted.');await refresh();
  });
  db.auth.onAuthStateChange(()=>{setTimeout(showSession,0);});showSession();
})();
</script></body></html>
